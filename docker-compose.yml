services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:-v2026.9.7}
    container_name: hermes
    restart: unless-stopped
    # Le conteneur démarre root (s6-overlay), chown le volume, puis bascule sur
    # l'utilisateur `hermes` via s6-setuidgid : sans SETUID/SETGID il meurt en
    # boucle. KILL sert à signaler ces process depuis PID 1 au `docker stop`.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/opt/data
      - ${WORKSPACE_PATH:-./workspace}:/workspace:rw
    # 127.0.0.1 only: published ports bypass ufw (Docker's DNAT is evaluated
    # before ufw's chains). Reach the dashboard over an SSH tunnel.
    ports:
      - "127.0.0.1:9119:9119"
    environment:
      - HERMES_DASHBOARD=1
    env_file:
      - .env
    shm_size: 1g
    # s6 supervise plusieurs services : 10s (le défaut) peut couper court.
    stop_grace_period: 30s
    # Rotation au niveau du service, pour ne pas dépendre du daemon.json de l'hôte.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          # `pids_limit` au niveau du service entre en conflit avec ce bloc.
          pids: 512
    command: gateway run
