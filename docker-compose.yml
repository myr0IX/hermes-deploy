services:
  hermes:
    image: nousresearch/hermes-agent:v2026.6.5
    container_name: hermes
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/opt/data
      - ${WORKSPACE_PATH:-./workspace}:/workspace:rw
    ports:
      - "127.0.0.1:8642:8642"
    env_file:
      - .env
    command: gateway run
